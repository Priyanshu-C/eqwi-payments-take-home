enum CardBrand {
  VISA
  MASTERCARD
  AMEX
}

type PaymentMethod {
  id: ID!
  brand: CardBrand!
  last4: String!
  expMonth: Int!
  expYear: Int!
  nickname: String!
}

input AddPaymentMethodInput {
  "One of the fake card presets. Stands in for a tokenized card."
  presetId: ID!
  nickname: String!
  "Generated by the client. Resending the same key returns the original result."
  idempotencyKey: String!
}

type Query {
  paymentMethods: [PaymentMethod!]!
}

type Mutation {
  addPaymentMethod(input: AddPaymentMethodInput!): PaymentMethod!
}
